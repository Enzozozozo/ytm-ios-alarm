name: Generate Daily Alarm Snippet

on:
  schedule:
    # Runs daily at 21:00 UTC (adjust to your preferred evening time)
    - cron: '0 21 * * *'
  workflow_dispatch: # Allows manual trigger anytime from the GitHub Actions tab

permissions:
  contents: write

jobs:
  build-alarm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alarm Pipeline
        env:
          YTM_PLAYLIST_ID: ${{ secrets.YTM_PLAYLIST_ID || vars.YTM_PLAYLIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python main.py

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alarm-m4a
          path: output/alarm.m4a
          if-no-files-found: error
          retention-days: 7

      - name: Publish to GitHub Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Alarm Snippet
          body: "Automated daily alarm snippet generated by The Alarm Demon."
          files: output/alarm.m4a
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
